<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-library" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04120D" />
      <stop offset="60%" stop-color="#0B2E22" />
      <stop offset="100%" stop-color="#071F17" />
    </linearGradient>
    <radialGradient id="library-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#DFCA95" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg-library)" />
  <circle cx="400" cy="270" r="280" fill="url(#library-glow)" />

  <!-- Bookshelves in Background -->
  <g stroke="#C6A15B" stroke-width="2" opacity="0.4" fill="none">
    <line x1="80" y1="180" x2="720" y2="180" stroke-width="4" />
    <line x1="80" y1="280" x2="720" y2="280" stroke-width="4" />
    <line x1="80" y1="380" x2="720" y2="380" stroke-width="4" />

    <!-- Shelf 1 books -->
    <rect x="120" y="100" width="30" height="80" fill="#0B2E22" />
    <rect x="155" y="90" width="25" height="90" fill="#14532D" />
    <rect x="185" y="110" width="35" height="70" fill="#0B2E22" />
    <rect x="580" y="95" width="28" height="85" fill="#14532D" />
    <rect x="615" y="105" width="35" height="75" fill="#0B2E22" />

    <!-- Shelf 2 books -->
    <rect x="100" y="200" width="32" height="80" fill="#14532D" />
    <rect x="138" y="190" width="26" height="90" fill="#0B2E22" />
    <rect x="630" y="210" width="35" height="70" fill="#14532D" />
  </g>

  <!-- Islamic Arch Framing -->
  <path d="M120 440 L120 180 C120 40 400 0 400 0 C400 0 680 40 680 180 L680 440" stroke="#C6A15B" stroke-width="3" fill="none" opacity="0.8" />

  <!-- Stack of Classical Kitab with Golden Calligraphy Spines -->
  <g transform="translate(400, 360)">
    <!-- Book 1 (bottom) -->
    <rect x="-140" y="30" width="280" height="40" rx="4" fill="#0B2E22" stroke="#C6A15B" stroke-width="2" />
    <line x1="-120" y1="50" x2="120" y2="50" stroke="#DFCA95" stroke-width="1.5" />

    <!-- Book 2 (middle) -->
    <rect x="-120" y="-15" width="240" height="40" rx="4" fill="#14532D" stroke="#C6A15B" stroke-width="2" />
    <line x1="-100" y1="5" x2="100" y2="5" stroke="#DFCA95" stroke-width="1.5" />

    <!-- Book 3 (top) -->
    <rect x="-95" y="-55" width="190" height="35" rx="4" fill="#071F17" stroke="#C6A15B" stroke-width="2" />
    <line x1="-75" y1="-38" x2="75" y2="-38" stroke="#DFCA95" stroke-width="1.5" />
  </g>

  <text x="400" y="525" text-anchor="middle" font-family="'Lora', serif" font-size="22" font-weight="bold" fill="#DFCA95" letter-spacing="2">
    PERPUSTAKAAN KHIDMAT TUROTS KLASIK
  </text>
  <text x="400" y="555" text-anchor="middle" font-family="'Lora', serif" font-size="13" fill="#C6A15B" letter-spacing="3">
    KOLEKSI LINTAS MADZHAB FIQIH &amp; ILMU ALAT
  </text>
</svg>
