<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-santri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2E22" />
      <stop offset="60%" stop-color="#14532D" />
      <stop offset="100%" stop-color="#071F17" />
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#DFCA95" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#C6A15B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0B2E22" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg-santri)" />
  <circle cx="400" cy="240" r="280" fill="url(#sun-glow)" />

  <!-- Morning Sunrise Rays -->
  <g stroke="#C6A15B" stroke-width="1.5" opacity="0.3" stroke-dasharray="6,6">
    <line x1="400" y1="240" x2="200" y2="80" />
    <line x1="400" y1="240" x2="300" y2="40" />
    <line x1="400" y1="240" x2="400" y2="20" />
    <line x1="400" y1="240" x2="500" y2="40" />
    <line x1="400" y1="240" x2="600" y2="80" />
  </g>

  <!-- Santri Silhouette in Halaqah Sitting Positon (Tasyahud / Iftirasy) -->
  <g transform="translate(400, 310)" fill="#F8F6EF" stroke="#C6A15B" stroke-width="2">
    <!-- White Peci / Songkok -->
    <ellipse cx="0" cy="-115" rx="22" ry="12" fill="#F8F6EF" />
    <rect x="-22" y="-115" width="44" height="20" rx="3" fill="#F8F6EF" />
    <!-- Head -->
    <circle cx="0" cy="-85" r="22" fill="#DFCA95" stroke="none" />
    <!-- White Koko Body / Shoulders -->
    <path d="M-60 10 L-35 -50 Q0 -60 35 -50 L60 10 Z" fill="#F8F6EF" />
    <!-- Green Sarung Fold (Lap) -->
    <path d="M-90 60 Q-90 20 -50 10 L50 10 Q90 20 90 60 Q0 85 -90 60 Z" fill="#0B2E22" stroke="#C6A15B" stroke-width="2.5" />
    
    <!-- Small Rehal with Kitab in Front -->
    <path d="M-40 45 L0 25 L40 45" stroke="#DFCA95" stroke-width="3" fill="none" />
    <rect x="-30" y="20" width="60" height="15" rx="2" fill="#FFF" stroke="#C6A15B" stroke-width="1" />
  </g>

  <text x="400" y="525" text-anchor="middle" font-family="'Lora', serif" font-size="22" font-weight="bold" fill="#DFCA95" letter-spacing="2">
    MUROJA'AH &amp; TADARRUS PAGI HARI
  </text>
  <text x="400" y="555" text-anchor="middle" font-family="'Lora', serif" font-size="13" fill="#C6A15B" letter-spacing="3">
    PEMBIASAAN ISTIQAMAH &amp; AKHLAQUL KARIMAH
  </text>
</svg>
